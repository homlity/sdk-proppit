openapi: 3.1.0
info:
  title: Real Time Processor API
  description: |-
    This API implements a set of public endpoints that allow clients (CRMs)
    to create, update, and delete publishers ads in real-time.
    
    ## Getting started
    To start using the API, check the following steps:
    
    1. **Use token endpoint:** Using your `user` and `password`, request a token using the endpoint  `[POST] /token`. This endpoint returns a Unix timestamp, which represents the **expiration time** of the token. It also returns a token that must be used in every request using the header `Authorization: Bearer $token`.
    
    2. **Create a publisher:** Create a new publisher using the endpoint `[POST] /proppit/{country}/publishers`. The publisher has to be approved first by our team before you start creating new ads. We will contact you when the publisher is ready to use. If you want to use an email as your publisher ID, please input the email in lowercase.
    
    3. **Create ads:** When our support team approves your publisher, you will be ready to create new ads using endpoint `[POST] /proppit/{country}/ads`.
    
    For further details, you can check the full documentation below for each endpoint.
    
    ## Errors
    These are the errors codes more likely to be seen:
    | **HTTP Status** | **Description** |
    | :-------------- | :-------------- |
    | **400 (Bad Request)** | The parameters or the body are invalid, usually because of a failed validation. |
    | **401 (Unauthorized)** | Missing or invalid `token`. Please, review the Authorization section. |
    | **404 (Not Found)** | The resource cannot be found. Note that it doesn't necessarily mean it does not exist, but rather that it's not available for the provided credentials. |
    | **500 (Internal Server Error)** | An unhandled exception occurred. Please, report the issue, including the full response, to the Support Team so we can tackle it. |
    | **502 (Bad Gateway)** | There was a communication error. Please, try again the operation in a few minutes. |
    | **503 (Service Unavailable)** | The API is temporarily out of service. Please, try again the operation in a few minutes. |
    | **504 (Gateway Timeout)** | There was a timeout error. Please, try again the operation in a few minutes. |

    #### Error Response Schema
    This is the schema of the object you will receive if an error happens. Please, include the error response in
    your emails when reporting issues.

    | **Field**      | **Type**       | Description |
    | :------------- | :------------- | :------------- |
    | **status** | integer | The [HTTP status code](https://developer.mozilla.org/en-US/docs/Web/HTTP/Status) of the error. |
    | **requestId** | string | A unique identifier of the request. Please use this identifier when contacting support. |
    | **error** | string | The reason of the failure. |
    | **timestamp** | date-time | The UTC time when the error occurred in ISO 8601 format (e.g., 2023-10-01T12:00:00Z). |
contact:
  name: Ingester
  email: ingester@lifullconnect.com
servers:
  - url: 'https://real-time.proppit.com/api/v2'
    description: production
paths:
  /token:
    post:
      summary: Token
      operationId: get-token
      security: [ ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: string
                password:
                  type: string
              required: [ user, password ]
            example:
              user: usernam3
              password: passw0rd
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  expiration:
                    type: integer
              example:
                token: abcd
                expiration: 1671620388
      tags:
        - Authorization

