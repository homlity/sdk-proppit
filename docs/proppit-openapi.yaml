      summary: Get property types
      operationId: get-property-types
      description: >-
        Based on the selected country, this endpoint returns the eligible property types and their respective allowed values for: nearbyLocations, amenities and rules.
      security:
        - Authorization: [ ]
      parameters:
        - name: country
          in: path
          required: true
          schema:
