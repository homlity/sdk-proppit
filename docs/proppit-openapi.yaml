              - url: 'https://i.ibb.co/8zgTtSh/a.jpg'
      properties:
        referenceId:
          type: string
        publisher:
          $ref: '#/components/schemas/AdPublisher'
        contact:
          $ref: '#/components/schemas/Contact'
        property:
          $ref: '#/components/schemas/Property'
        status:
          type: string
          enum:
            - published
          example: published
          readOnly: true
        operations:
          type: array
          items:
            $ref: '#/components/schemas/Operation'
        title:
          $ref: '#/components/schemas/LocalisedText'
        description:
          $ref: '#/components/schemas/LocalisedText'
        multimedia:
          $ref: '#/components/schemas/Multimedia'
        totalArea:
          $ref: '#/components/schemas/Area'
          description: |-
            **MANDATORY** for the property type "land".
            **OPTIONAL** for the following property types:
            - house
            - villa
            - commercial
            - industrial unit
            - apartment
            - office
        floorArea:
          $ref: '#/components/schemas/Area'
          description: |-
            Do not include this tag for the property type "land".
            **MANDATORY** for all other property types.
        usableArea:
          $ref: '#/components/schemas/Area'
        isBoosted:
          type: boolean
          description: |-
            **OPTIONAL** Use this field to increase ads visibility (up to your current plan's maximum amount of ads).
            true/false values are accepted.
            If the tag isn't included, it'll default to false, and the most recent properties will have a higher visibility instead.
        bedrooms:
          type: number
          minimum: 0
        bathrooms:
          type: number
          minimum: 0
        halfBathrooms:
          type: number
          minimum: 0
          description: |-
            This field is **only allowed** in the following property types for each country:
              * MX: house, apartment, house in gated community, condo, commercial, commercial land, horizontal condo, ranch, penthouse, commercial in mall, quinta, villa, loft, studio, duplex, octor office, hotel.
              * PA: house, commercial, office.
              * CL: apartment, house, commercial, office.
              * PE: condo, car park, beach house, room.
              * CO: commercial, apartment, house, villa, office.
        stratum:
          type: number
          minimum: 1
          maximum: 7
          description: |-
            This field is allowed for all property types, but **only in CO**.
        parkingSpaces:
          type: number
          minimum: 0
        constructionYear:
          type: number
          example: 2020
          minimum: 1500
          maximum: 2100
        condition:
          $ref: '#/components/schemas/Condition'
        furnished:
          $ref: '#/components/schemas/Furnished'
        rules:
          type: array
          items:
            $ref: '#/components/schemas/Rules'
        amenities:
          type: array
          items:
            $ref: '#/components/schemas/Amenity'
        paymentMethodsDetails:
          type: string
        acceptedPaymentMethods:
          type: string
          enum:
            - forbidden_bank_credit
            - bank_credit
            - cash
            - infonavit
            - fovissste
          description: |-
            This field should only be sent for **MX**, it won't work on any other countries.
      required:
        - referenceId
        - publisher
        - property
        - operations
        - title
        - description
    Amenity:
      type: string
      description: >-
        To check the allowed values for amenities, refer to the "Get Property Types" endpoint at `/proppit/{country}/property-types`.
    Area:
      type: object
      examples:
        - value: 200.2
          unit: sqm
      properties:
        value:
          type: number
          example: 200.2
        unit:
          type: string
          example: sqm
      required:
        - value
        - unit
      description: >-
        All areas must be provided in square meters (sqm).

        We indicate below the types of areas that must be reported for each
        property type:

        - Apartment / Office: 
          - Total area in **floorArea**
        - House / villa / commercial / industrial unit: 
          - Total area in **floorArea**
          - Land area in **totalArea**
        - Land:
          - Land area in **totalArea**
    Condition:
      type: string
      enum:
        - excellent
        - good
        - normal
        - to renew
        - second hand
        - ruin
        - semi-renovated
        - semi-new
        - in construction
        - new
        - renovated
    Contact:
      type: object
      examples:
        - name: Test
          email: user@example.com
          phone: '+541122451177'
          whatsapp: '+541122451177'
      description: Used for the contact details of each listing.
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        whatsapp:
          type: string
      required:
        - name
        - email
    Coordinates:
      type: object
      description: Locates the listings and make them visible in website searches.
      properties:
        lat:
          type: number
        long:
          type: number
      required:
        - lat
        - long
    Country:
      type: string
      enum:
        - AE
        - AR
        - CL
        - CO
        - EC
        - ES
        - ID
        - MX
        - PA
        - PE
        - PH
        - TH
        - VN
    Furnished:
      type: string
      enum:
        - fully
        - partly
        - unfurnished
      description: >-
        Used to indicate whether the property is fully furnished, partially furnished, or unfurnished.
    Geo:
      type: object
      properties:
        name:
          type: string
        level:
          $ref: '#/components/schemas/LocationLevel'
      required:
        - name
        - level
    Locale:
      type: string
      enum:
        - es-AR
        - es-CL
        - es-CO
        - es-MX
        - es-PE
        - en-PH
        - id-ID
        - th-TH
        - vi-VN
        - es-ES
        - es-PA
        - es-EC
      description: >-
        Used to indicate the language of the text.
    Location:
      type: object
      examples:
        - countryCode: AE
          visibility: accurate
          geo:
            - name: string
              level: administrative_area_level_1
          coordinates:
            lat: 90.1
            long: -90.2
          address: string
          postcode: string
      properties:
        countryCode:
          $ref: '#/components/schemas/Country'
        visibility:
          $ref: '#/components/schemas/Visibility'
        geo:
          type: array
          items:
            $ref: '#/components/schemas/Geo'
        coordinates:
          $ref: '#/components/schemas/Coordinates'
        address:
          type: string
        postcode:
          type: string
        nearbyLocations:
          type: array
          items:
            $ref: '#/components/schemas/NearByLocation'
      required:
        - coordinates
    LocationLevel:
      type: string
      enum:
        - administrative_area_level_1
        - administrative_area_level_2
        - administrative_area_level_5
        - neighborhood
        - sublocality_level_1
        - sublocality_level_2
        - locality
        - aws_region
        - aws_sub_region
        - aws_minucipality
        - aws_neighborhood
    LocalisedText:
      type: object
      properties:
        locale:
          $ref: '#/components/schemas/Locale'
        text:
          type: string
      required:
        - locale
        - text
    Multimedia:
      type: object
      examples:
        - pictures:
            url: string
          floorPlans:
            - string
          videos:
            - string
          virtualTours:
            - string
      properties:
        pictures:
          type: array
          items:
            $ref: '#/components/schemas/Picture'
        floorPlans:
          type: array
          items:
            $ref: '#/components/schemas/OtherMultimedia'
        videos:
          type: array
          items:
            $ref: '#/components/schemas/OtherMultimedia'
        virtualTours:
          type: array
          items:
            $ref: '#/components/schemas/OtherMultimedia'
    Operation:
      type: object
      properties:
        type:
          type: string
          enum:
            - rent
            - sell
          example: sell
        price:
          $ref: '#/components/schemas/OperationPrice'
      required:
        - type
        - price
    OperationPrice:
      type: object
      properties:
        value:
          type: number
        currency:
          $ref: '#/components/schemas/Currency'
        periodicity:
          $ref: '#/components/schemas/PricePeriodicity'
      required:
        - value
        - currency
    PricePeriodicity:
      type: string
      enum:
        - yearly
        - monthly
        - daily
      example: monthly
      description: >-
        Used to indicate the periodicity of the rental price. 
        **NOTE:** This field is only allowed in ID when the operation type is "rent".
    CommunityFeesPrice:
      type: object
      examples:
        - value: 1000.2
          currency: USD
      properties:
        value:
          type: number
        currency:
          $ref: '#/components/schemas/Currency'
      required:
        - value
        - currency
    Project:
      type: object
      examples:
        - name: 'My Project Name'
      properties:
        name:
          type: string
    Currency:
      type: string
      enum:
        - AED
        - ARS
        - CLF
        - CLP
        - COP
        - EUR
        - MXN
        - PAB
        - PEN
        - PHP
        - THB
        - USD
        - VND
        - IDR
    Picture:
      type: object
      examples:
        - url: string
      properties:
        url:
          type: string
          description: >-
            The URL of the image. The content type **MUST** be **image/*** or **application/octet-stream**.
      required:
        - url
    OtherMultimedia:
      type: object
      examples:
        - url: string
      properties:
        url:
          type: string
      required:
        - url
    Property:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/PropertyType'
        location:
          $ref: '#/components/schemas/Location'
        communityFees:
          $ref: '#/components/schemas/CommunityFeesPrice'
          description: Used to indicate the amount of property maintenance fees
        floor:
          type: string
        bankProperty:
          type: boolean
          description: Available only for MX "Propiedad en Remate".
        project:
          $ref: '#/components/schemas/Project'
          description: The project name **MUST** match exactly the desired project's. Failure to do so won't throw an error, but won't assign a project to your property.
      required:
        - type
        - location
    PropertyType:
      type: string
      description: >-
        To check the allowed values for property types, refer to the "Get Property Types" endpoint at `/proppit/{country}/property-types`.
    AdPublisher:
      type: object
      examples:
        externalId: ag00003
      properties:
        externalId:
          type: string
      required:
        - externalId
    NearByLocation:
      type: string
      description: >-
        To check the allowed values for nearbyLocations, refer to the "Get Property Types" endpoint at `/proppit/{country}/property-types`.
    Rules:
      type: string
      description: |-
        Includes whether the rental property only accepts families, or if it
        accepts animals and/or children.

        To check the allowed values for rules, refer to the "Get Property Types" endpoint at `/proppit/{country}/property-types`.
    Visibility:
      type: string
      enum:
        - accurate
        - approximate
      example: accurate
      description: >-
        Used to display the exact or approximate location of the properties on the websites.

        If the tag is sent empty or not included, we will mark the listings as
        'Approximate'
    Publisher:
      type: object
      examples:
        - id: example-agency-id
          name: Example Agency
          email: agency@example.com
          phone: 123-456-7890
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        phone:
          type: string
      required:
        - id
    PropertyTypesArray:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
          nearbyLocations:
            type: array
            items:
              type: string
          amenities:
            type: array
            items:
              type: string
          rules:
            type: array
            items:
              type: string
      example:
        - id: "apartment"
          nearbyLocations:
            - "main street"
            - "sea"
            - "shopping mall"
          amenities:
            - "air conditioning"
            - "fireplace"
            - "garden"
            - "sauna"
          rules:
            - "pets allowed"
            - "children allowed"
        - id: "house"
          nearbyLocations:
            - "main street"
            - "train station"
            - "sauna"
          amenities:
            - "balcony"
            - "electricity"
          rules:
            - "pets allowed"
            - "children allowed"
            - "only families"
    Error:
      type: object
      properties:
        status:
          type: integer
          description: The [HTTP status code](https://developer.mozilla.org/en-US/docs/Web/HTTP/Status) of the error.
        requestId:
          type: string
          description: A unique identifier of the request. Please use this identifier when contacting support.
        error:
          type: string
          description: The reason of the failure.
        timestamp:
          type: string
          format: date-time
          description: The UTC time when the error occurred in ISO 8601 format (e.g., 2023-10-01T12:00:00Z).
  securitySchemes:
    Authorization:
      type: http
      scheme: bearer
      description: ''
